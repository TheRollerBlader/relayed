<title id="title">Deterministic matcher: requests served by scenario</title><desc id="desc">Synthetic fixtures, not live shelter metrics. First-come: 1 matched, 1 unmatched. Suitability: 2 matched, 0 unmatched. Current capacity: 1 matched, 1 unmatched. +1 accessible charger: 2 matched, 0 unmatched. Water stock: 2 units: 2 matched, 1 unmatched.</desc>
